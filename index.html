<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>שטותניק בשנות ה-80 · Pre-Order</title>
  <meta name="description" content="מהדורת שנות ה-80 של שטותניק: 3 עיצובים חדשים וקפוצ׳ונים איכותיים, מיוצרים במיוחד למי שמזמין. הזמנה מראש, מסירה ביד באירוע." />
  <meta name="theme-color" content="#0B0320" />

  <meta property="og:title"       content="שטותניק בשנות ה-80 · Merch Drop" />
  <meta property="og:description" content="מהדורת שנות ה-80: 3 עיצובים חדשים + קפוצ׳ונים איכותיים לחורף. הזמנה מראש בלבד, מסירה באירוע." />
  <meta property="og:type"        content="website" />
  <meta property="og:image"       content="img/shirt-black.jpg" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Heebo:wght@300;400;500;700;800;900&family=Monoton&family=Rubik:wght@700;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Heebo', 'system-ui', 'sans-serif'],
            display: ['Rubik', 'Heebo', 'sans-serif'],
            retro:   ['Audiowide', 'Heebo', 'sans-serif'],
            tube:    ['Monoton', 'Audiowide', 'sans-serif'],
          },
          colors: {
            ink:        '#07020F',  /* page black, violet tinted */
            night:      '#0B0320',  /* raised surface            */
            dusk:       '#1A0840',  /* elevated panel            */
            neonPink:   '#FF2E88',  /* Vice pink · from the logo */
            neonCyan:   '#22D3FF',  /* Miami cyan                */
            neonViolet: '#A43BFF',  /* synth violet              */
            sunset:     '#FFAA1F',  /* sun amber                 */
            lemon:      '#FFE45C',  /* sun core                  */
            chalk:      '#F4EEFF',  /* text                      */
          },
          boxShadow: {
            'glow-pink':   '0 0 22px rgba(255,46,136,.55), 0 0 64px rgba(255,46,136,.22)',
            'glow-cyan':   '0 0 22px rgba(34,211,255,.50), 0 0 64px rgba(34,211,255,.18)',
            'glow-violet': '0 0 22px rgba(164,59,255,.55), 0 0 64px rgba(164,59,255,.20)',
            'glow-sun':    '0 0 22px rgba(255,170,31,.50), 0 0 64px rgba(255,46,136,.20)',
          },
          animation: { fadein: 'fadein .35s ease-out' },
          keyframes: {
            fadein: { from: { opacity: 0, transform: 'translateY(10px)' }, to: { opacity: 1, transform: 'none' } },
          },
        },
      },
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Pinned version + classic JSX runtime forced below; never use floating @babel/standalone (its React-preset default flipped to the automatic runtime, which emits `import react/jsx-runtime` and breaks a no-bundler page). -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    :root {
      --ink: #07020F; --night: #0B0320; --dusk: #1A0840;
      --pink: #FF2E88; --cyan: #22D3FF; --violet: #A43BFF;
      --sunset: #FFAA1F; --lemon: #FFE45C; --chalk: #F4EEFF;
    }

    /* ── Base ── */
    html { background: var(--ink); scroll-padding-top: 72px; }
    body {
      font-family: 'Heebo', sans-serif; color: var(--chalk);
      -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea { font-size: 16px !important; }
    a, button, [role="button"] { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
    ::selection { background: rgba(255,46,136,.45); color: #fff; }

    /* ══ AMBIENT · fixed night sky behind everything ══
       transform/opacity only, pointer-events:none, its own compositor layer. */
    #ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(ellipse 900px 600px at 85% 0%,   rgba(164,59,255,.22), transparent 60%),
        radial-gradient(ellipse 800px 520px at 5% 40%,   rgba(255,46,136,.12), transparent 60%),
        radial-gradient(ellipse 1000px 700px at 50% 110%, rgba(34,211,255,.10), transparent 60%),
        linear-gradient(180deg, #0B0320 0%, #07020F 55%, #0A0224 100%);
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    #root { position: relative; z-index: 1; }

    .stars {
      position: absolute; inset: -10%;
      background-image:
        radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent 60%),
        radial-gradient(1px 1px   at 32% 64%, #BDF3FF, transparent 60%),
        radial-gradient(1.6px 1.6px at 58% 22%, #FFD0E6, transparent 60%),
        radial-gradient(1px 1px   at 76% 72%, #fff, transparent 60%),
        radial-gradient(1.2px 1.2px at 88% 38%, #BDF3FF, transparent 60%),
        radial-gradient(1px 1px   at 44% 88%, #FFD0E6, transparent 60%),
        radial-gradient(1.3px 1.3px at 6% 82%, #fff, transparent 60%);
      background-size: 420px 420px;
      opacity: .75;
      /* static on purpose: every glass panel blurs what is behind it, so an
         animated layer here would force a re-blur of every panel each frame */
    }
    .stars.s2 { background-size: 640px 640px; opacity: .5; }

    /* CRT scanlines · faint texture on the BACKGROUND only. It lives inside
       #ambient (under all content), so it never draws over a product photo. */
    .scanlines {
      position: absolute; inset: 0; pointer-events: none;
      /* plain alpha, no mix-blend-mode: blending a full-screen fixed layer
         forces the whole page to re-composite on every scroll frame */
      background: repeating-linear-gradient(to bottom, rgba(7,2,15,.11) 0 1px, transparent 1px 3px);
    }

    /* ══ HERO SCENE · sky → sun → mountains → grid floor → palms ══
       The horizon is derived from the sun's size so everything stays aligned
       at every breakpoint. */
    .scene {
      --sun: 300px; --sunTop: 96px;
      --horizon: calc(var(--sunTop) + var(--sun) * .74);
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(180deg,
        #0B0320 0%, #1B0746 calc(var(--horizon) * .55), #4A0F63 calc(var(--horizon) * .85),
        #8A1767 var(--horizon), #0B0320 calc(var(--horizon) + 1px), #07020F 100%);
    }
    @media (min-width: 768px) { .scene { --sun: 470px; --sunTop: 80px; } }

    .sun-glow {
      position: absolute; left: 50%; top: calc(var(--sunTop) - var(--sun) * .25);
      width: calc(var(--sun) * 1.7); height: calc(var(--sun) * 1.5); transform: translateX(-50%);
      background: radial-gradient(circle at 50% 55%, rgba(255,120,80,.45), rgba(255,46,136,.20) 40%, transparent 68%);
      filter: blur(20px);
      animation: sun-pulse 7s ease-in-out infinite;
    }
    .sun {
      position: absolute; left: 50%; top: var(--sunTop); transform: translateX(-50%);
      width: var(--sun); height: var(--sun); border-radius: 50%;
      background: linear-gradient(180deg, var(--lemon) 0%, var(--sunset) 32%, #FF5A6E 60%, var(--pink) 78%, var(--violet) 100%);
      /* the classic sliced-sun stripes, thickening toward the horizon */
      -webkit-mask-image: linear-gradient(180deg,
        #000 0 48%, transparent 48% 50.5%, #000 50.5% 57%, transparent 57% 60.5%,
        #000 60.5% 66%, transparent 66% 70.5%, #000 70.5% 75%, transparent 75% 80.5%,
        #000 80.5% 84%, transparent 84% 91%, #000 91% 100%);
              mask-image: linear-gradient(180deg,
        #000 0 48%, transparent 48% 50.5%, #000 50.5% 57%, transparent 57% 60.5%,
        #000 60.5% 66%, transparent 66% 70.5%, #000 70.5% 75%, transparent 75% 80.5%,
        #000 80.5% 84%, transparent 84% 91%, #000 91% 100%);
    }
    @keyframes sun-pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

    .mountains {
      position: absolute; left: 0; right: 0; height: calc(var(--sun) * .32);
      top: calc(var(--horizon) - var(--sun) * .32 + 1px);
    }
    .mountains svg { width: 100%; height: 100%; display: block; }

    .floor {
      position: absolute; left: 0; right: 0; top: var(--horizon); bottom: 0;
      perspective: 260px; perspective-origin: 50% 0%; overflow: hidden;
      background: linear-gradient(180deg, #1A0640 0%, #0B0320 40%, #07020F 100%);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 92%);
              mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 92%);
    }
    .floor-plane {
      position: absolute; left: -60%; right: -60%; top: 0; height: 220%;
      transform-origin: 50% 0%;
      background-image:
        linear-gradient(rgba(255,46,136,.85) 2px, transparent 2px),
        linear-gradient(90deg, rgba(34,211,255,.75) 2px, transparent 2px);
      background-size: 56px 56px;
      background-position: center top;
      animation: grid-run 1.6s linear infinite;
      will-change: transform;
    }
    /* loop distance == one grid cell, otherwise the grid jumps */
    @keyframes grid-run {
      from { transform: rotateX(72deg) translate3d(0, 0, 0); }
      to   { transform: rotateX(72deg) translate3d(0, 56px, 0); }
    }
    .horizon-line {
      position: absolute; left: 0; right: 0; top: var(--horizon); height: 2px;
      background: linear-gradient(90deg, transparent, var(--pink) 20%, #FFB0D4 50%, var(--pink) 80%, transparent);
      box-shadow: 0 0 18px 3px rgba(255,46,136,.65);
    }

    .palm {
      position: absolute; top: calc(var(--horizon) - var(--sun) * .95);
      height: calc(var(--sun) * 1.15); width: auto;
      filter: drop-shadow(0 0 1px rgba(255,46,136,.9)) drop-shadow(0 0 10px rgba(255,46,136,.35));
      transform-origin: 50% 100%;
      animation: sway 9s ease-in-out infinite;
    }
    .palm.left  { left: -6%; }
    .palm.right { right: -6%; animation-delay: -4s; }
    .palm.right svg, .palm.left svg { height: 100%; width: auto; display: block; }
    .palm.right svg { transform: scaleX(-1); }
    @media (min-width: 768px) { .palm.left { left: 3%; } .palm.right { right: 3%; } }
    @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.4deg); } }

    /* ── Hero logo · floats, with a breathing neon halo ── */
    .hero-logo { position: relative; display: inline-flex; }
    .hero-logo::before {
      content: ''; position: absolute; inset: -12%; border-radius: 50%;
      background: radial-gradient(circle, rgba(34,211,255,.22), rgba(255,46,136,.18) 45%, transparent 70%);
      filter: blur(22px); z-index: 0;
      animation: sun-pulse 5s ease-in-out infinite;
    }
    .hero-logo img {
      position: relative; z-index: 1;
      filter: drop-shadow(0 6px 0 rgba(7,2,15,.55)) drop-shadow(0 0 18px rgba(255,46,136,.35));
      animation: levitate 6.5s ease-in-out infinite;
    }
    @keyframes levitate { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(0deg); } }

    /* ── Type treatments ── */
    .chrome {
      background: linear-gradient(180deg,
        #FFFFFF 0%, #E6F9FF 30%, #9FDFFF 47%, #3A1470 50%, #FF6FB5 54%, #FFD1E8 75%, #FFFFFF 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 rgba(7,2,15,.9)) drop-shadow(0 0 16px rgba(255,46,136,.35));
    }
    .neon-grad {
      background: linear-gradient(100deg, var(--pink) 0%, #FF6A5C 38%, var(--sunset) 62%, var(--cyan) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 14px rgba(255,46,136,.35));
    }
    .neon-pink  { color: #FF8CC0; text-shadow: 0 0 6px rgba(255,46,136,.9), 0 0 18px rgba(255,46,136,.6), 0 0 40px rgba(255,46,136,.35); }
    .neon-cyan  { color: #B5F1FF; text-shadow: 0 0 6px rgba(34,211,255,.9), 0 0 18px rgba(34,211,255,.55), 0 0 40px rgba(34,211,255,.3); }
    .eyebrow    { font-family: 'Audiowide', sans-serif; letter-spacing: .28em; font-size: 11px; }

    /* neon tube sign that occasionally stutters, like a real sign */
    .flicker { animation: flicker 6s linear infinite; }
    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: .35; }
    }

    /* ── Neon glass panel · gradient border via padding-box/border-box ── */
    .panel {
      border: 1px solid transparent;
      background:
        linear-gradient(160deg, rgba(40,14,86,.72), rgba(14,4,36,.78)) padding-box,
        linear-gradient(135deg, rgba(255,46,136,.55), rgba(164,59,255,.22) 45%, rgba(34,211,255,.55)) border-box;
      -webkit-backdrop-filter: blur(12px) saturate(130%);
              backdrop-filter: blur(12px) saturate(130%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 12px 34px rgba(0,0,0,.45);
    }
    .panel-hover { transition: box-shadow .3s ease, transform .3s ease; }
    .panel-hover:hover {
      transform: translateY(-3px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 18px 44px rgba(0,0,0,.5),
                  0 0 30px rgba(255,46,136,.22), 0 0 60px rgba(34,211,255,.10);
    }
    @media (max-width: 640px) {
      .panel { -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); }
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .panel { background:
        linear-gradient(160deg, rgba(40,14,86,.96), rgba(14,4,36,.97)) padding-box,
        linear-gradient(135deg, rgba(255,46,136,.55), rgba(164,59,255,.22) 45%, rgba(34,211,255,.55)) border-box; }
    }

    /* ── Flagship card · the hoodie. Thicker hot border + halo behind. ── */
    .panel-flagship {
      border-width: 2px;
      background:
        linear-gradient(160deg, rgba(48,14,96,.80), rgba(14,4,36,.86)) padding-box,
        linear-gradient(135deg, var(--pink), var(--violet) 45%, var(--cyan)) border-box;
      box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 40px rgba(255,46,136,.30), 0 0 90px rgba(34,211,255,.14);
    }
    .flagship-halo::before {
      content: ''; position: absolute; inset: -20px; border-radius: 36px;
      background: radial-gradient(ellipse at 50% 35%, rgba(255,46,136,.30), rgba(34,211,255,.12) 55%, transparent 76%);
      filter: blur(26px); pointer-events: none; z-index: 0;
      animation: sun-pulse 6.5s ease-in-out infinite;
    }

    /* ── Product stage · only visible while a mockup is missing / loading ── */
    .stage {
      position: relative; overflow: hidden;
      background: radial-gradient(ellipse 75% 65% at 50% 40%, #4A1C80 0%, #221048 58%, #10052C 100%);
    }
    .stage::before {
      content: ''; position: absolute; left: -30%; right: -30%; bottom: 0; height: 42%;
      background-image:
        linear-gradient(rgba(255,46,136,.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,255,.40) 1px, transparent 1px);
      background-size: 26px 26px;
      transform: perspective(200px) rotateX(55deg); transform-origin: 50% 100%;
      -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 90%);
              mask-image: linear-gradient(to top, #000 0%, transparent 90%);
      pointer-events: none;
    }
    .stage > img, .stage > .img-missing { position: relative; z-index: 1; }

    /* Product photos are shown exactly as supplied: no filter, blend, opacity,
       hover zoom or overlay texture. Once a real photo is in the frame, the
       neon stage behind it is switched off too — plain neutral backing only. */
    .product-img { filter: none; mix-blend-mode: normal; opacity: 1; transform: none; }
    .stage:has(> img) { background: #0B0320; }
    .stage:has(> img)::before { display: none; }

    /* placeholder shown when an image file is not in the folder yet */
    .img-missing {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      text-align: center; padding: 14px; color: #FFD0E6;
      border: 2px dashed rgba(255,46,136,.55); background: rgba(7,2,15,.35);
    }
    .img-missing code {
      font-family: 'Audiowide', monospace; font-size: 11px; color: var(--cyan);
      background: rgba(34,211,255,.08); border: 1px solid rgba(34,211,255,.3);
      padding: 2px 8px; border-radius: 6px; direction: ltr; word-break: break-all;
    }

    /* ── Buttons ── */
    .btn-sunset {
      color: #1A0530;
      background: linear-gradient(100deg, var(--pink) 0%, #FF6A5C 50%, var(--sunset) 100%);
      box-shadow: 0 0 20px rgba(255,46,136,.45), 0 0 60px rgba(255,120,60,.16), inset 0 1px 0 rgba(255,255,255,.45);
      transition: transform .15s ease, filter .2s ease, box-shadow .2s ease;
    }
    .btn-sunset:hover  { filter: brightness(1.08) saturate(1.1); box-shadow: 0 0 28px rgba(255,46,136,.6), 0 0 80px rgba(255,120,60,.25), inset 0 1px 0 rgba(255,255,255,.5); }
    .btn-sunset:active { transform: scale(.97); }
    .btn-ghost {
      color: #B5F1FF; border: 1.5px solid rgba(34,211,255,.6); background: rgba(34,211,255,.06);
      box-shadow: 0 0 14px rgba(34,211,255,.18), inset 0 0 14px rgba(34,211,255,.07);
      text-shadow: 0 0 8px rgba(34,211,255,.5);
      transition: background .2s ease, box-shadow .2s ease, transform .15s ease;
    }
    .btn-ghost:hover  { background: rgba(34,211,255,.13); box-shadow: 0 0 22px rgba(34,211,255,.35), inset 0 0 16px rgba(34,211,255,.12); }
    .btn-ghost:active { transform: scale(.97); }
    .btn-off { background: rgba(255,255,255,.05); color: rgba(244,238,255,.34); cursor: not-allowed; }
    .btn-done { background: linear-gradient(100deg, var(--cyan), #7CF7D4); color: #07202A; transform: scale(.97); }

    /* toggles (type / color / size) */
    .opt {
      border: 1px solid rgba(244,238,255,.14); color: rgba(244,238,255,.62);
      transition: border-color .2s, color .2s, background .2s, box-shadow .2s, transform .15s;
    }
    .opt:hover  { border-color: rgba(34,211,255,.45); color: rgba(244,238,255,.9); }
    .opt:active { transform: scale(.95); }
    .opt.on {
      border-color: var(--cyan); color: #CFF7FF; background: rgba(34,211,255,.14);
      box-shadow: 0 0 16px rgba(34,211,255,.45), inset 0 0 10px rgba(34,211,255,.15);
      text-shadow: 0 0 8px rgba(34,211,255,.6);
    }

    /* gloss sweep on primary CTAs */
    .sheen { position: relative; overflow: hidden; }
    .sheen::after {
      content: ''; position: absolute; top: -20%; bottom: -20%; width: 38%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
      transform: skewX(-18deg); pointer-events: none;
      animation: sheen-sweep 5.5s ease-in-out infinite;
    }
    @keyframes sheen-sweep { 0% { left: -55%; } 55%, 100% { left: 130%; } }

    /* ── Marquee ticker ── */
    .marquee { overflow: hidden; white-space: nowrap; }
    .marquee-track { display: inline-flex; animation: marquee 32s linear infinite; will-change: transform; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ── Countdown LED tiles ── */
    .led {
      font-family: 'Audiowide', sans-serif; font-variant-numeric: tabular-nums;
      color: #CFF7FF; text-shadow: 0 0 6px rgba(34,211,255,.95), 0 0 20px rgba(34,211,255,.55);
    }

    /* ── Section divider · a neon tube ── */
    .tube {
      height: 2px; border: 0; margin: 0 auto; max-width: 320px;
      background: linear-gradient(90deg, transparent, var(--pink), var(--cyan), transparent);
      box-shadow: 0 0 12px rgba(255,46,136,.6);
    }

    /* ── Scroll reveal · the hiding class is added by JS, so no-JS = visible ── */
    .reveal { opacity: 0; transform: translateY(26px);
      transition: opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1); }
    .reveal.is-visible { opacity: 1; transform: none; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--pink), var(--violet), var(--cyan)); border-radius: 9px; }

    body.no-scroll { overflow: hidden; }

    /* ── Mobile: fewer moving layers ── */
    @media (max-width: 640px) {
      .stars.s2 { display: none; }
      .floor-plane { animation-duration: 2.2s; }
      .scanlines { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-glow, .floor-plane, .palm, .hero-logo::before, .hero-logo img,
      .flicker, .sheen::after, .marquee-track, .flagship-halo::before { animation: none !important; }
      .sheen::after { display: none; }
      .floor-plane { transform: rotateX(72deg); }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      .panel-hover:hover { transform: none; }
    }

    /* ── Viewport height (iOS URL bar) ── */
    .app-shell { min-height: 100vh; }
    @supports (min-height: 100dvh) { .app-shell { min-height: 100dvh; } }

    /* ── aspect-ratio fallback (iOS < 15) ── */
    @supports not (aspect-ratio: 1 / 1) {
      .stage.aspect-square { height: 0; padding-bottom: 100%; }
      .stage.aspect-square > img,
      .stage.aspect-square > .img-missing { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    }

    .modal-safe {
      padding-top:    calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }
    .mobile-cart-bar { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }

    /* ── Accessibility widget — vertical center, left edge ── */

(function(){

/* Scroll reveal. Waits for Tailwind (CDN, runtime) and images to settle, then hides
   only what is below the fold — anything already on screen is never hidden. */
function useReveal() {
  useEffect(function () {
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || !('IntersectionObserver' in window)) return;
    var io = null;
    var start = setTimeout(function () {
      var els = document.querySelectorAll('[data-reveal]');
      var vh  = window.innerHeight || document.documentElement.clientHeight;
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add('is-visible');
          io.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
      Array.prototype.forEach.call(els, function (el) {
        var r = el.getBoundingClientRect();
        if (r.top < vh * 0.92) return;
        var d = parseInt(el.getAttribute('data-reveal'), 10);   // stagger in ms; bare attr = "true"
        if (d > 0) el.style.transitionDelay = d + 'ms';
        el.classList.add('reveal');
        io.observe(el);
      });
    }, 450);
    // safety net: never leave anything hidden
    var safety = setTimeout(function () {
      Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function (el) { el.classList.add('is-visible'); });
    }, 15000);
    return function () { clearTimeout(start); clearTimeout(safety); if (io) io.disconnect(); };
  }, []);
}

function Countdown() {
  var calcTime = function () {
    var diff = Math.max(0, DEADLINE - Date.now());
    return {
      days:    Math.floor(diff / 86400000),
      hours:   Math.floor((diff % 86400000) / 3600000),
      minutes: Math.floor((diff % 3600000)  / 60000),
      seconds: Math.floor((diff % 60000)    / 1000),
      done:    diff === 0,
    };
  };
  const [t, setT] = useState(calcTime);
  useEffect(function () {
    var id = setInterval(function () { setT(calcTime()); }, 1000);
    return function () { clearInterval(id); };
  }, []);

  if (t.done) return <div className="font-display font-black text-2xl neon-pink">ההזמנות נסגרו. נתראה על הרחבה 🌴</div>;

  var units = [

    { v: t.minutes, l: 'דקות' }, { v: t.seconds, l: 'שניות' },
  ];
  return (
    <div className="flex items-start gap-1.5 sm:gap-3 justify-center" dir="ltr" role="timer" aria-live="off">

   ══════════════════════════════════════════════════════════════════ */

function Lightbox({ src, alt, onClose }) {
  useEffect(function () {
    if (!src) return;
    document.body.classList.add('no-scroll');
    var fn = function (e) { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', fn);
    return function () { document.body.classList.remove('no-scroll'); window.removeEventListener('keydown', fn); };
  }, [src, onClose]);
  if (!src) return null;
  return (
    <div role="dialog" aria-modal="true" aria-label="תצוגה מורחבת"
      className="fixed inset-0 z-50 bg-ink/95 backdrop-blur-md flex items-center justify-center p-4 animate-fadein"
      onClick={onClose}>
      <button onClick={(e) => { e.stopPropagation(); onClose(); }} aria-label="סגור"
        className="absolute top-4 end-4 w-12 h-12 rounded-full btn-ghost text-2xl flex items-center justify-center">✕</button>
      <Img src={src} alt={alt} className="max-w-[92vw] max-h-[88vh] min-w-[260px] min-h-[260px] object-contain rounded-2xl shadow-glow-pink" />
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════════ */

function App() {
  const [cart, setCart]         = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const [name, setName]         = useState('');
  const [phone, setPhone]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [done, setDone]         = useState(null);
  const [error, setError]       = useState('');
  const closed = useClosed();
  useReveal();

  // Current order id. A ref, not state: it never affects rendering and must
  // survive retries without re-rendering.
  const orderIdRef = useRef('');

  const t          = cartTotals(cart);
  const totalCount = t.count;
  const total      = t.total;
  const formReady  = !!name.trim() && phoneValid(phone) && !closed;
  const missing    = configMissing();

  /* Shirt cap is optional (MAX_SHIRTS); hoodies are flat-priced and never capped. */
  const addToCart = useCallback((item) => setCart(function (p) {
    if (item.kind === 'shirt' && shirtsFull(countKind(p, 'shirt'))) return p;
    return p.concat([item]);
  }), []);
  const removeFromCart = useCallback((uid) => { setError(''); setCart((p) => p.filter((x) => x.uid !== uid)); }, []);

  /* Strict checkout flow:
       1. loading state
       2. POST to the Google Sheet
       3. wait for the answer and verify ok:true
       4. only then redirect to the single Selector link
     Any failure => error message, no redirect. */
  const submitOrder = () => {
    if (!formReady || totalCount === 0 || loading) return;

    var link = paymentLink();

    /* Created once and kept in a ref, so "try again" after a failure sends the
       same id. The script upserts by it, so a retry updates the same row instead
       of creating a duplicate order (a timed-out request may still have landed). */
    if (!orderIdRef.current) {
      orderIdRef.current = 'SH-' + Date.now().toString(36).toUpperCase();
    }

    setError('');
    setLoading(true);

    var payload = {
      sheetName:    SHEET_TAB,          // the script writes the row into this tab
      orderId:      orderIdRef.current,
      name:         name.trim(),
      phone:        phone.trim(),
      /* One line per item, readable as a packing list:
         "חולצה · עיצוב A (שחור) · מידה M | קפוצ׳ון · לבן · מידה XL" */
      details:      cart.map(function (it) {
        return it.kind === 'hoodie'
          ? 'קפוצ׳ון · ' + it.colorLabel + ' · מידה ' + it.size
          : it.typeLabel + ' · ' + it.designName + ' (' + it.colorLabel + ') · מידה ' + it.size;
      }).join(' | '),
      quantity:     totalCount,
      shirtCount:   t.shirts,
      hoodieCount:  t.hoodies,
      shirtsPrice:  t.shirtsPrice,
      hoodiesPrice: t.hoodiesPrice,
      totalPrice:   total,
      paymentLink:  link,
      items:        JSON.stringify(cart.map(function (it) {
        return { kind: it.kind, design: it.designLabel, color: it.colorLabel, type: it.typeLabel, size: it.size };
      })),
    };

    // No sheet URL yet — test mode: skip saving and show the confirmation.
    if (!SHEET_URL) {
      setTimeout(function () { setLoading(false); setDone(payload); }, 500);
      return;
    }

    // mode:'cors' so we can READ the answer and know the save really happened.
    // text/plain avoids a preflight (OPTIONS) that Apps Script cannot answer;
    // the body is still JSON and is read from e.postData.contents.
    var ctrl  = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS);

    fetch(SHEET_URL, {
      method:   'POST',
      mode:     'cors',
      redirect: 'follow',
      headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
      body:     JSON.stringify(payload),
      signal:   ctrl.signal,
    })
      .then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error((data && data.error) || 'invalid response');
        // Only here is the order definitely saved — go pay.
        if (link) { window.location.href = link; return; }
        setLoading(false);
        setDone(payload);
      })
      .catch(function (err) {
        clearTimeout(timer);
        setLoading(false);
        var aborted = err && err.name === 'AbortError';
        /* After a timeout we do NOT know whether the order landed, so never claim
           it was not saved. Retrying is safe: same order id, same row. */
        setError(aborted
          ? 'לקח לשרת יותר מדי זמן לענות. לא חויבתם. אפשר ללחוץ "נסו שוב" בבטחה — לא תיווצר הזמנה כפולה.'

        console.error('Order submit failed:', err);
      });
  };

     confirmation never overwrites the previous order's row. */
  const closeDone = () => {
    orderIdRef.current = '';
    setDone(null); setCart([]); setName(''); setPhone(''); setError('');
  };

  const goto = (id) => { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

    : loading ? '⚡ רגע, שומרים לכם מקום...'
    : !name.trim() ? '✍️ מלאו שם מלא כדי להמשיך'
    : !phoneValid(phone) ? '📱 מלאו מספר טלפון כדי להמשיך'
    : error ? '↻ נסו שוב'
    : paymentLink() ? 'מעבר לתשלום מאובטח בסלקטור 🔒' : 'שריינו לי את ההזמנה 🌴';

                  <strong className="font-black text-sunset">עמלת הסליקה עלינו! תתחדשו 🔥</strong>
                  <br />
                  הפעם צוות ההפקה מכסה את עמלת הסליקה של סלקטור — המחיר שאתם רואים בעגלה הוא בדיוק מה שתשלמו, בלי תוספות.
                </span>
              </div>

              {/* CTA */}
              <button onClick={submitOrder} disabled={!formReady || loading}
                className={'w-full rounded-xl px-6 py-5 text-base sm:text-lg font-black transition min-h-[60px] ' +
                  (!formReady || loading ? 'btn-off' : 'btn-sunset sheen')}>
                {ctaLabel}
              </button>

              <p className="text-center text-xs text-chalk/40 mt-3 leading-relaxed">
                אנחנו שומרים רק את השם, הטלפון, העיצובים והמידות שהזמנתם — כדי לשריין אותם עבורכם. 👽
              </p>

              {/* TODO · confirm the cancellation policy for this event */}
              <p className="text-center text-[11px] text-chalk/35 mt-4 pt-4 border-t border-white/[0.07] leading-relaxed max-w-md mx-auto">
                הפריטים מיוצרים בהזמנה אישית. ניתן לבטל עד למועד סגירת ההזמנות באתר (בניכוי 5% דמי ביטול).
                לאחר סגירת ההזמנות הפריטים עוברים לייצור ולא יתאפשרו ביטולים.
              </p>
            </div>
          )}
        </div>
      </section>

      {/* FOOTER */}
      <footer className="relative border-t border-neonPink/20">
        <div className="max-w-6xl mx-auto px-4 py-12 text-center text-chalk/50 text-sm space-y-3">
          <div className="flex justify-center"><Logo className="w-44 h-auto opacity-90" /></div>
          <div className="font-tube text-xl neon-cyan" dir="ltr">SEE YOU ON THE FLOOR</div>
          <div>נתראה על הרחבה ב{EVENT_NAME}. ✌️👽</div>
          <div className="text-xs text-chalk/40">🇮🇱 מיוצר בישראל, באהבה ובהשקעה.</div>
          <div className="text-xs text-chalk/30 pt-2">© {new Date().getFullYear()} Shtutnik · כל הזכויות והאהבה שמורות.</div>
        </div>
      </footer>

      {/* MOBILE STICKY CART BAR */}
      {totalCount > 0 && (
        <div className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-ink/95 backdrop-blur border-t border-neonPink/30 px-4 pt-3 mobile-cart-bar">
          <button onClick={() => goto('cart')}
            className="btn-sunset w-full flex items-center justify-between gap-3 rounded-xl px-5 py-3.5 font-black min-h-[52px]">
            <span className="flex items-center gap-2">
              <span className="bg-ink/25 rounded-full w-7 h-7 flex items-center justify-center text-sm">{totalCount}</span>
              לעגלה
            </span>
            <span className="font-retro">{total}₪ ←</span>
          </button>
        </div>
      )}

      <Lightbox src={lightbox ? lightbox.src : null} alt={lightbox ? lightbox.alt : ''} onClose={() => setLightbox(null)} />
      <SuccessModal order={done} onClose={closeDone} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Manual Babel transform: classic JSX runtime, then execute -->
<script>
(function () {
  function boot() {
    try {
      var src = document.getElementById('app-source').textContent;
      var out = Babel.transform(src, {
        presets: ['env', ['react', { runtime: 'classic' }]]
      }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;color:#fff;font-family:Heebo,sans-serif">' +
        '<div style="font-size:40px">📼</div><p>שגיאה בטעינת האתר. רעננו את הדף.</p>' +
        '<pre style="color:#FF2E88;font-size:11px;white-space:pre-wrap">' + (e && e.message) + '</pre></div>';
      console.error('App boot failed:', e);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
